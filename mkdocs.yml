  - Technical docs:
      - Architecture: ARCHITECTURE.md
      - USB gadget transport: USB_GADGET.md
      - USB bridge measurements: USB_BRIDGE.md
      - T113 bootstrap: T113_BOOTSTRAP.md
      - T113 service GPIOs: T113_GPIO.md
      - Serial link loss: SERIAL_LINK_LOSS.md
      - CFS print mapping: CFS_PRINT_MAPPING.md
      - CFS protocol: CFS_VALIDATION.md
      - Hardware test plan: HARDWARE_TEST_PLAN.md
      - Test status: TEST_STATUS.md
      - Roadmap: ROADMAP.md
