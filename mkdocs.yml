site_name: K2-OpenHost Wiki
site_description: Creality K2 Pro on an external Kalico + Moonraker host - install, CFS, slicer, troubleshooting
site_url: https://mztechnology97.github.io/K2-OpenHost/
repo_url: https://github.com/MzTechnology97/K2-OpenHost
repo_name: MzTechnology97/K2-OpenHost
edit_uri: edit/main/docs/
copyright: K2-OpenHost - for experienced users only. Use at your own risk.

theme:
  name: material
  language: en
  logo: images/wiki/logo.svg
  favicon: images/wiki/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

extra_css:
  - stylesheets/extra.css

hooks:
  - hooks/wiki_links.py

plugins:
  - search:
      lang:
        - en
        - it
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: it
          name: Italiano
          build: true
          site_name: K2-OpenHost Wiki
          nav_translations:
            Home: Home
            Getting started: Primi passi
            Installation: Installazione
            Helper script: Helper script
            Using K2-OpenHost: Uso
            CFS firmware: Firmware CFS
            Reference: Riferimenti
            Technical docs: Documentazione tecnica
            How it works: Come funziona
            Requirements: Requisiti
            Disclaimer and limits: Esclusione di responsabilità e limiti
            1. Prepare the host: 1. Preparare l'host
            2. Prepare the printer (T113): 2. Preparare la stampante (T113)
            3. First start and checks: 3. Primo avvio e controlli
            Updates and releases: Aggiornamenti e release
            Backup and restore: Backup e ripristino
            Back to stock: Tornare allo stock
            Menu reference: Riferimento del menu
            Doctor and health check: Doctor e controllo di salute
            The CFS: Il CFS
            Printing: Stampare
            OrcaSlicer plugin: Plugin OrcaSlicer
            HelixScreen (printer screen): HelixScreen (schermo della stampante)
            Notifications: Notifiche
            Camera: Fotocamera
            Host and CPU fan: Host e ventola della CPU
            Versions: Versioni
            Flash and roll back: Flash e rollback
            Runtime parameters (CFG6): Parametri runtime (CFG6)
            Live remaining filament: Residuo in tempo reale
            Third-party RFID tags: Tag RFID di terze parti
            Spool geometry per vendor: Geometria delle bobine per produttore
            G-code commands: Comandi G-code
            Debug and diagnostics: Debug e diagnostica
            Configuration: Configurazione
            Troubleshooting: Risoluzione problemi
            Recovery runbook: Procedura di recupero
            Architecture: Architettura
            USB gadget transport: Trasporto USB gadget
            USB bridge measurements: Misure del bridge USB
            T113 bootstrap: Bootstrap T113
            T113 service GPIOs: GPIO di servizio T113
            Serial link loss: Perdita del collegamento seriale
            CFS print mapping: Abbinamento della stampa CFS
            CFS protocol: Protocollo CFS
            Hardware test plan: Piano di test hardware
            Test status: Stato dei test
            Credits and references: Riconoscimenti e riferimenti

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MzTechnology97/K2-OpenHost
  generator: false

nav:
