      - How it works: getting-started/how-it-works.md
      - Requirements: getting-started/requirements.md
      - Disclaimer and limits: DISCLAIMER.md
  - Installation:
      - installation/index.md
      - 1. Prepare the host: installation/host.md
      - 2. Prepare the printer (T113): installation/printer.md
      - 3. First start and checks: installation/first-start.md
      - Updates and releases: installation/updates.md
