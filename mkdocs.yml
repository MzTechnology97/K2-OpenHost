      - Flash and roll back: cfs-firmware/flash.md
      - Runtime parameters (CFG6): cfs-firmware/parameters.md
      - Live remaining filament: cfs-firmware/remaining.md
      - Third-party RFID tags: cfs-firmware/third-party-rfid.md
      - Spool geometry per vendor: cfs-firmware/spool-geometry.md
  - Reference:
      - G-code commands: GCODE_COMMANDS.md
      - Debug and diagnostics: reference/debug.md
      - Configuration: reference/configuration.md
      - Troubleshooting: reference/troubleshooting.md
      - Recovery runbook: RECOVERY.md
